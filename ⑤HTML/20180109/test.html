<!DOCTYPE html>
<html>
<head>
	<title>登陆页面</title>
	<meta charset="utf-8">
	<link rel="stylesheet" type="text/css" href="css/login.css">
	<script type="text/javascript" src="js/check.js"></script>
</head>
<body>
	<div align="center" class="login" style="padding-top: 50px" onsubmit="return checkfrom()">
		<form action="" name="embellish" method="post">
			<table width="740" height="500" background="images/登录页面原始图.jpg">                           
				<!--第一行-->
				<tr height="175">
					<td colspan="4"></td>
				</tr>
				<!--第二行-->
				<tr height="20">
					<td width="40%"></td>
					<td width="10%">用户名:</td>
					<td><input type="test" name="用户名"></td>
					<td width="30%"></td>
				</tr>
				<!--第三行-->
				<tr height="20">
					<td width="40%"></td>
					<td width="10%">密码:</td>
					<td><input type="password" name="密码"></td>
					<td width="30%"></td>
				</tr>
				<!--第四步按钮-->
				<tr height="20">
					<td width="40%"></td>
					<td width="10%"><input type="submit" name="login" value="登陆"></td>
					<td><input type="reset" name="reset" value="重置"</td>
					<td width="30%"></td>
				</tr>
				<!--第五步-->
				<tr>
					<td colspan="4"></td>
			</table>
		</form>

	</div>

</body>
</html>
