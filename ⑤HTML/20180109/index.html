<!DOCTYPE html>
<html>
<head>
	<title>网站登录页面</title>
	<meta charset="utf-8">
	<link rel="stylesheet" type="text/css" href="css/login.css">
	<script type="text/javascript" src="js/in.js"></script>
</head>
<body>
<div align="center" class="login">
	<!--表单，用来放输入框密码框，可以提交给别的页面-->
	<form action="" name="login" method="get" onsubmit="return checkFrom()">
		<table width="740" height="500" background="images/登录页面原始图.jpg">
			<!--第一行-->
			<tr height="190">
				<td colspan="4"></td>
			</tr>
			<!--第二行-->
			<tr height="20">
				<td width="40%"></td>
				<td width="10%">用户名:</td>
				<td width="20%"><input type="text" name="user"></td>
				<td width="30%"></td>
			</tr>
			<!--第三行-->
			<tr height="20">
				<td></td>
				<td>密码:</td>
				<td><input type="password" name="password"></td>
				<td></td>
			</tr>
			<!--第四行-->
			<tr height="20">
				<td></td>
				<td><input type="submit" name="login" value="登录"></td>
				<td><input type="reset" name="reset" value="重置"></td>
				<td></td>
			</tr>
			<!--第五行-->
			<tr>
				<td colspan="4"></td>
			</tr>
		</table>
	</form>
</div>
</body>
</html>
